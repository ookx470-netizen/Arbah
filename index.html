<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OXLO - المنصة الرقمية الرسمية</title>
    <meta name="description" content="منصة OXLO الرسمية للمهام والأرباح الرقمية" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OXLO" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <style>
      /* Prevent text selection and image dragging */
      body {
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      img {
        pointer-events: none;
      }
      #devtools-shield {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: #0a0a0a;
        color: #fff;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        text-align: center;
        padding: 24px;
      }
    </style>
    <script>
      /*
        تم تعطيل نظام "منع الفحص" (منع الزر الأيمن / F12 / كشف أدوات المطور)
        نهائيًا بناءً على قرار صاحب المشروع بتاريخ 2026-08-21.

        السبب: هذا النوع من الحماية شكلي بحت (client-side) ولا يمنع شخص
        يعرف التقنية من الوصول الحقيقي؛ وبالمقابل كان يسبب مشاكل حقيقية:
        حجب مستخدمين شرعيين بالخطأ (خصوصًا داخل متصفحات التطبيقات مثل
        تيليجرام)، ومنع حتى صاحب الموقع نفسه من التشخيص وقت الحاجة.

        الحماية الحقيقية للبيانات موجودة بمكان آخر تمامًا: قواعد أمان
        Firestore المنشورة بـ Firebase Console — وهي غير متأثرة بهذا الملف
        إطلاقًا. حذف هذا الكود لا يقلل من أمان بيانات المستخدمين أبدًا.

        الكود الكامل الأصلي محفوظ أدناه كتعليق فقط، لو احتجت ترجعه لاحقًا.

      // منع الزر الأيمن
      document.addEventListener('contextmenu', event => event.preventDefault());

      // منع الاختصارات: F12, Ctrl+Shift+I/J/C, Ctrl+U, Ctrl+S
      document.addEventListener('keydown', function (e) {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) ||
          (e.ctrlKey && ['u', 'U', 's', 'S'].includes(e.key))
        ) {
          e.preventDefault();
          return false;
        }
      });

      // كشف فتح أدوات المطور عبر فرق التوقيت (debugger loop) + كشف فرق أبعاد النافذة
      (function () {
        var shield = null;
        function showShield() {
          if (!shield) {
            shield = document.createElement('div');
            shield.id = 'devtools-shield';
            shield.style.display = 'flex';
            shield.innerHTML = '<div>تم إيقاف الوصول لأسباب أمنية.<br/>الرجاء إغلاق أدوات المطور وإعادة تحميل الصفحة.</div>';
            document.body.appendChild(shield);
          } else {
            shield.style.display = 'flex';
          }
        }

        var ua = navigator.userAgent || '';
        var isInAppBrowser = /Telegram|Instagram|FBAN|FBAV|Line\/|MicroMessenger|TikTok/i.test(ua);

        if (!isInAppBrowser) {
          var debuggerHits = 0;
          setInterval(function () {
            var before = performance.now();
            debugger;
            var after = performance.now();
            if (after - before > 300) {
              debuggerHits++;
              if (debuggerHits >= 3) showShield();
            } else {
              debuggerHits = 0;
            }
          }, 800);

          var threshold = 220;
          var sizeHits = 0;
          setInterval(function () {
            var widthDiff = window.outerWidth - window.innerWidth;
            var heightDiff = window.outerHeight - window.innerHeight;
            if (widthDiff > threshold || heightDiff > threshold) {
              sizeHits++;
              if (sizeHits >= 3) showShield();
            } else {
              sizeHits = 0;
            }
          }, 800);
        }
      })();
      */
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
